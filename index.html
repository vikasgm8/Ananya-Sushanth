
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Golden Story 🤎</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="flower-layer" id="flowerLayer"></div>

  <main>
    <section class="screen" id="loginScreen">
      <div class="top-flower">❀</div>
      <p class="eyebrow">A SPECIAL LITTLE SURPRISE</p>

      <h1>Our Golden<br>Story</h1>
      <div class="heart">♡</div>

      <p class="subtitle">
        A little world, made<br>
        just for two...
      </p>

      <div class="divider">✦ ❀ ✦</div>

      <p class="password-title">Enter our secret password</p>

      <input
        type="password"
        id="password"
        placeholder="Your secret password"
      >

      <button onclick="unlock()">Unlock Our Story ♡</button>

      <p id="message"></p>
      <div class="bottom-flower">❀</div>
    </section>

    <section class="screen welcome hidden" id="welcomeScreen">
      <div class="bloom">🌸</div>
      <p class="eyebrow">THE WAIT IS OVER</p>
      <h1>Welcome,<br>Ananya & Sushanth</h1>
      <p class="subtitle">
        This little world holds<br>
        your memories, your moments<br>
        and your beautiful story.
      </p>
      <div class="divider">✦ ❀ ✦</div>
      <button onclick="enterStory()">Enter Our World →</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

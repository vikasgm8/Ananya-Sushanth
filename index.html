
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#351d11">
  <title>Ananya & Sushanth | Our Golden Story</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="flowerLayer"></div>

  <main>

    <!-- PASSWORD SCREEN -->
    <section class="screen" id="loginScreen">

      <div class="decor decor-top">❀</div>

      <p class="eyebrow">A SPECIAL LITTLE SURPRISE</p>

      <h1>Our Golden<br>Story</h1>

      <div class="heart">♡</div>

      <p class="subtitle">
        A little world, made<br>
        just for two...
      </p>

      <div class="divider">✦ ❀ ✦</div>

      <p class="password-title">Enter your secret password</p>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="off"
      >

      <button id="unlockButton">Unlock Our Story ♡</button>

      <p id="message" aria-live="polite"></p>

      <div class="decor decor-bottom">❀</div>

    </section>


    <!-- WELCOME SCREEN -->
    <section class="screen hidden" id="welcomeScreen">

      <div class="welcome-flower">🌸</div>

      <p class="eyebrow">THE WAIT IS OVER</p>

      <h1 class="welcome-title">
        Welcome,<br>
        Ananya & Sushanth
      </h1>

      <p class="subtitle">
        This little world holds<br>
        your memories, your moments<br>
        and your beautiful story.
      </p>

      <div class="divider">✦ ❀ ✦</div>

      <p class="small-note">Made with love, just for you two.</p>

      <button id="enterButton">Enter Our World →</button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
